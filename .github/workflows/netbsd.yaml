name: netbsd

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

defaults:
  run:
    shell: sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

#        osver: [ '10.0' ]
#        compiler: [ 'gcc' ]
#        arch: [ 'x86_64' ]
#        sanitizer: [ 'address', 'none' ]
#        tls: [ 'true' ]
#        def_debug: [ 'true' ]

jobs:
  netbsd:
    strategy:
      fail-fast: false
      matrix:
        osver: [ '10.2', '11.1' ]
        compiler: [ 'gcc', 'clang' ]
        arch: [ 'x86_64', 'aarch64' ]
        sanitizer: [ 'address', 'none' ]
        tls: [ 'true', 'false' ]
        def_debug: [ 'true', 'false' ]
        exclude:
          # The base GCC runtime has incompatible SHA-2 interceptors that
          # break OpenSSL. Current compiler-rt contains the upstream fix.
          # https://github.com/llvm/llvm-project/issues/110215
          - compiler: 'gcc'
            sanitizer: 'address'
          - compiler: 'clang'
            sanitizer: 'none'
          # NetBSD 11's close-on-fork descriptors make the system LSan
          # tracer's clone(CLONE_FILES) fail with EINVAL after timezone use.
          # Keep ASan/LSan on 10.2 and regular coverage on both releases.
          # https://mail-index.netbsd.org/tech-toolchain/2025/10/01/msg004751.html
          - osver: '11.1'
            sanitizer: 'address'
          - arch: 'aarch64'
            def_debug: 'true'
          # pkgsrc's compiler-rt does not build NetBSD AArch64 sanitizers.
          # Retain AArch64 coverage with the regular GCC jobs.
          - arch: 'aarch64'
            compiler: 'clang'
          - arch: 'aarch64'
            tls: 'false'

    # Note above: As of Apr/2026, aarch64 is run on an emulator,
    # making it very slow. When debug output is turned on, some tests
    # will fail just for being too slow, so we exclude the
    # arch: 'aarch64' + def_debug: 'true' case.
    # We also exclude some other arch: 'aarch64' cases to reduce the
    # size of the matrix

    runs-on: ubuntu-latest
    name: A job to test in NetBSD
    env:
        CC: ${{ matrix.compiler }}

    steps:
    # For FreeBSD, the closest analog to the install list we use in
    # linux.yaml would be something like:
    # pkg install -y $compiler git meson pkgconf cmake brotli brotli zstd rapidjson libevent ca_root_nss curl gnupg doxygen googletest openssl
    # However, if we do that we get weird seg faults and aborts during
    # testing, probably because we are using multiple incompatible
    # versions of one or more library (e.g. incompatible versions of
    # openssl between googletest and libcurl). To avoid those sort of
    # problems, we install a minimum list of packages as dependencies.
    #
    # For OpenBSD, we minimize the package list similarly to FreeBSD
    - uses: actions/checkout@v6
    - name: Test NetBSD
      id: test
      uses: vmactions/netbsd-vm@v1
      with:
        release: ${{ matrix.osver }}
        arch: ${{ matrix.arch }}
        envs: 'CC'
        usesh: true
        prepare: |


        run: |
          echo "Install Dependencies"
          if [ ${{ matrix.compiler }} = gcc ]; then compiler=""; else compiler="clang compiler-rt"; fi
          {
            echo "Attempting to use default NetBSD package repository"
            /usr/sbin/pkg_add -u curl
          } || {
            echo "Default repository failed. Will attempt to use alternate:"
            export PKG_PATH="http://ftp.fr.netbsd.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r)/All/"
            echo $PKG_PATH
            /usr/sbin/pkg_add -u curl
          }
          /usr/sbin/pkg_add -u $compiler meson brotli pkgconf rapidjson libevent
          # The system libstdc++ leaks locale facets for some named locales.
          # Use the classic locale consistently across the CI processes.
          export LC_ALL=C
          echo "Configure Meson"
          if [ ${{ matrix.compiler }} = gcc ]; then
            CXX=g++
          else
            # Use one shared sanitizer runtime across the tests and library.
            CXX="clang++ -shared-libasan"
            CXX_LD=ld
            export LD_LIBRARY_PATH="$(clang -print-runtime-dir)"
          fi
          export CXX CXX_LD
          # NetBSD libc exports an older llvm_gcda_* ABI. Collect coverage
          # with GCC, separately from Clang's sanitizer instrumentation.
          meson setup build \
          -DPISTACHE_BUILD_TESTS=true -DPISTACHE_DEBUG=${{ matrix.def_debug }} -DPISTACHE_USE_SSL=${{ matrix.tls }} -DPISTACHE_USE_CONTENT_ENCODING_DEFLATE=true -DPISTACHE_USE_CONTENT_ENCODING_BROTLI=true -DPISTACHE_USE_CONTENT_ENCODING_ZSTD=true \
            --buildtype=debug -Db_coverage=${{ matrix.compiler == 'gcc' && 'true' || 'false' }} -Db_sanitize=${{ matrix.sanitizer }} -Db_lundef=false \
            || (cat build/meson-logs/meson-log.txt ; false)
           echo "Build"
           ninja -C build
           echo "Test"
           if [ '${{ matrix.sanitizer }}' = address ]; then
             # NetBSD's ASan runtime requires ASLR disabled for each test executable.
             find build/tests -type f -name 'run_*' -exec paxctl +a {} +
             export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:abort_on_error=1
           fi
           meson test -C build --verbose
    # Note: The "run" command is what runs inside NetBSD
    #

# export PKG_PATH="http://ftp.fr.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/10.0/All/"
